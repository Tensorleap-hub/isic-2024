data:
  data_dir: /Users/orram/Tensorleap/data/isic-2024
  images_file: train-image.hdf5
  metadata_file: train-metadata.csv
  subset_file: subset.parquet
  folds_file: folds.parquet
  reference_oof_file: weights/oof_predictions.csv
  n_folds: 5
  validation_fold: 0
  train_negatives: 20000
  val_negatives: 10000
  seed: 42

image:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

model:
  model_path: model/model.onnx
  checkpoint: weights/fold_0_epoch_23_score_0.1712.pth
  backbone: vit_tiny_patch16_224.augreg_in21k_ft_in1k
  input_name: image
  output_index: 0
  labels: [benign, malignant]

train:
  lr: 1.0e-4
  lr_decay_rate: 1.0
  weight_decay: 1.0e-3
  warmup_ratio: 0.05
  min_lr: 1.0e-6
  batch_size: 32
  batch_size_val: 512
  num_epochs: 30
  early_stop_count: 100
  ratio_int: 1
  ratio_int_val: 10
  ratio_upsampling: 2
  val_confidence_min: 80
  negative_pool: all
  num_workers: 4
  seed: 42
  runs_dir: runs
